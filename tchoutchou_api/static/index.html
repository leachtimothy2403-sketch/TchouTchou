<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TchouTchou</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171d2b;
    --border: #2a3245;
    --text: #e8ecf4;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --ok: #35c98f;
    --warn: #f0b429;
    --bad: #f0524f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px 16px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 24px; }
  form { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  input {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 1rem;
  }
  input#trainNumber { flex: 1 1 160px; }
  input#date { flex: 0 1 150px; }
  button {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 1rem; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .panel h2 { font-size: 0.95rem; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .headline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .headline .num { font-size: 1.6rem; font-weight: 700; }
  .label-tag {
    display: inline-block; background: rgba(79,140,255,0.15); color: var(--accent);
    padding: 3px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
  }
  .route { color: var(--muted); margin-top: 4px; }
  .delay { font-weight: 700; }
  .delay.ontime { color: var(--ok); }
  .delay.late { color: var(--warn); }
  .delay.verylate { color: var(--bad); }
  .stop-time { font-variant-numeric: tabular-nums; }
  .delay-suffix { font-size: 0.8rem; font-weight: 600; }
  .delay-suffix.ontime { color: var(--ok); }
  .delay-suffix.late { color: var(--warn); }
  .delay-suffix.verylate { color: var(--bad); }
  .note { color: var(--muted); font-size: 0.85rem; margin-top: 8px; line-height: 1.4; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .badge.Confirmed { background: rgba(53,201,143,0.18); color: var(--ok); }
  .badge.Likely { background: rgba(240,180,41,0.18); color: var(--warn); }
  .badge.Unknown { background: rgba(139,147,167,0.18); color: var(--muted); }
  .unavailable { color: var(--muted); font-style: italic; }
  a.deeplink {
    display: inline-block; margin-top: 4px; color: var(--accent); text-decoration: none;
    font-weight: 600;
  }
  a.deeplink:hover { text-decoration: underline; }
  .error { color: var(--bad); }
  .stat-row { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 6px; }
  .stat { min-width: 90px; }
  .stat .v { font-size: 1.2rem; font-weight: 700; }
  .stat .l { font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>TchouTchou</h1>
  <p class="sub">Live status, platform, and reliability for French trains -- MVP.
    <a href="/static/search.html" style="color:var(--accent); font-weight:600;">Search a journey (TrainAware) →</a>
  </p>

  <form id="searchForm">
    <input id="trainNumber" placeholder="Train number (e.g. 9575 or UMOL09)" required>
    <input id="date" placeholder="Date YYYYMMDD (optional)">
    <button type="submit">Search</button>
  </form>

  <div id="results"></div>
</div>

<script>
const form = document.getElementById('searchForm');
const results = document.getElementById('results');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const trainNumber = document.getElementById('trainNumber').value.trim();
  const date = document.getElementById('date').value.trim();
  if (!trainNumber) return;
  results.innerHTML = '<div class="panel">Loading…</div>';
  try {
    const qs = date ? `?date=${encodeURIComponent(date)}` : '';
    const res = await fetch(`/api/trains/${encodeURIComponent(trainNumber)}${qs}`);
    const data = await res.json();
    render(data, trainNumber);
  } catch (err) {
    results.innerHTML = `<div class="panel error">Request failed: ${err}</div>`;
  }
});

function delayClass(min) {
  if (min === null || min === undefined) return '';
  if (min < 5) return 'ontime';
  if (min < 15) return 'late';
  return 'verylate';
}

function platformBadge(p) {
  if (!p) return '<span class="badge Unknown">Unknown</span>';
  const label = p.platform ? `${p.status}: ${p.platform}` : p.status;
  return `<span class="badge ${p.status}">${label}</span>`;
}

// Shows the actual clock time plus the delay next to it, e.g. "15:27 +2" -- previously
// this table only showed the delay number with no time at all, which made an on-time
// stop (delay 0) look identical to missing data. Fixed 2026-08-19.
function timeCell(time, delayMin) {
  if (!time) return '<span class="stop-time">–</span>';
  let delayStr = '';
  if (delayMin !== null && delayMin !== undefined) {
    const sign = delayMin > 0 ? '+' : '';
    delayStr = ` <span class="delay-suffix ${delayClass(delayMin)}">${sign}${delayMin}</span>`;
  }
  return `<span class="stop-time">${time}</span>${delayStr}`;
}

function render(data, trainNumber) {
  const s = data.status || {};
  const rel = data.reliability || {};
  const crowd = data.crowd || {};
  const link = data.deep_link || {};

  if (s.detail) {
    results.innerHTML = `<div class="panel error">${s.detail}</div>`;
    return;
  }

  let html = '';

  // Headline
  html += `<div class="panel">
    <div class="headline">
      <span class="num">Train ${s.train_number ?? trainNumber}</span>
      ${s.label ? `<span class="label-tag">${s.label}</span>` : ''}
      ${s.mission_code ? `<span class="label-tag" style="background:rgba(240,180,41,0.15);color:var(--warn)">mission code</span>` : ''}
    </div>
    <div class="route">${s.origin ?? '?'} → ${s.destination ?? '?'} ${s.date ? `· ${s.date}` : ''}</div>
    ${s.cancelled ? '<div class="delay verylate" style="margin-top:8px">CANCELLED</div>' :
      (s.delay_minutes !== null && s.delay_minutes !== undefined
        ? `<div class="delay ${delayClass(s.delay_minutes)}" style="margin-top:8px">${s.delay_minutes >= 0 ? '+' : ''}${s.delay_minutes} min</div>`
        : '')}
    ${s.note ? `<div class="note">${s.note}</div>` : ''}
  </div>`;

  // Stops / live tracking
  if (s.stops && s.stops.length) {
    html += `<div class="panel"><h2>Live tracking</h2>
      <table><thead><tr><th>Station</th><th>Arr.</th><th>Dep.</th><th>Platform</th></tr></thead><tbody>`;
    for (const st of s.stops) {
      html += `<tr>
        <td>${st.station_name ?? st.station_uic ?? '?'}</td>
        <td>${timeCell(st.arrival_time, st.arrival_delay_minutes)}</td>
        <td>${timeCell(st.departure_time, st.departure_delay_minutes)}</td>
        <td>${platformBadge(st.arrival_platform && st.arrival_platform.status !== 'Unknown' ? st.arrival_platform : st.departure_platform)}</td>
      </tr>`;
    }
    html += `</tbody></table>
      ${s.tracking_note ? `<div class="note">${s.tracking_note}</div>` : ''}
    </div>`;
  }

  // Reliability
  html += `<div class="panel"><h2>Reliability</h2>`;
  if (!rel.available) {
    html += `<div class="unavailable">${rel.reason ?? 'Not available.'}</div>`;
  } else {
    const o = rel.overall || {};
    html += `<div class="stat-row">
      <div class="stat"><div class="v">${o.on_time_pct ?? '–'}%</div><div class="l">on time</div></div>
      <div class="stat"><div class="v">${o.mean_delay_minutes ?? '–'} min</div><div class="l">mean delay</div></div>
      <div class="stat"><div class="v">${o.observations ?? 0}</div><div class="l">trips observed</div></div>
      <div class="stat"><div class="v">${rel.days_of_history ?? '–'}</div><div class="l">days of history</div></div>
    </div>`;
    if (rel.confidence_note) html += `<div class="note">${rel.confidence_note}</div>`;
  }
  html += `</div>`;

  // Crowd
  html += `<div class="panel"><h2>Crowd insights</h2>
    <div class="unavailable">${crowd.reason ?? 'Not available.'}</div></div>`;

  // Deep link
  html += `<div class="panel"><h2>Book</h2>
    <a class="deeplink" href="${link.url ?? '#'}" target="_blank" rel="noopener">Open on SNCF Connect →</a>
    ${link.confirmed === false ? `<div class="note">${link.note}</div>` : ''}
  </div>`;

  results.innerHTML = html;
}
</script>
</body>
</html>
